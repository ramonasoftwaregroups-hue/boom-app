apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    buildToolsVersion "34.0.0"
    namespace "ir.picassooads.boom.twa"

    defaultConfig {
        applicationId "ir.picassooads.boom.twa"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 4
        versionName "4"

        // ★ resValue حذف شد — چون appName در strings.xml تعریف شده
        // اگر هر دو باشند، خطای "Duplicate resources" می‌دهد

        // ★ برای پشتیبانی از vector drawable در همه‌ی APIها
        vectorDrawables.useSupportLibrary = true

        // ★ برای پشتیبانی چندزبانه
        resConfigs "fa", "en", "ar", "fr", "it", "de"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "${projectDir}/android.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    // ═══════════════════════════════════════════════════════════
    // تغییر نام فایل خروجی APK
    // ═══════════════════════════════════════════════════════════
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def newApkName = "BoomPicasso-${variant.versionName}.apk"
            outputFileName = newApkName
        }
    }
}

// ═══════════════════════════════════════════════════════════════
// تغییر نام فایل خروجی AAB
// ═══════════════════════════════════════════════════════════════
tasks.matching { it.name == "bundleRelease" }.configureEach {
    doLast {
        def bundleDir = new File(project.buildDir, "outputs/bundle/release")
        def oldFile = new File(bundleDir, "app-release.aab")
        def newFile = new File(bundleDir, "BoomPicasso-${android.defaultConfig.versionName}.aab")
        if (oldFile.exists()) {
            oldFile.renameTo(newFile)
        }
    }
}

// ═══════════════════════════════════════════════════════════════
// Force Kotlin stdlib version (جلوگیری از تضاد)
// ═══════════════════════════════════════════════════════════════
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    // فایل‌های JAR محلی
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // ═══════════════════════════════════════════════════════════
    // AndroidX (نسخه‌های Java-based)
    // ═══════════════════════════════════════════════════════════
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'

    // ⚠️ نسخه 1.5.0 خالص Java هست - تضاد Kotlin نداره
    implementation 'androidx.browser:browser:1.5.0'

    // ═══════════════════════════════════════════════════════════
    // Material Components
    // برای TextInputLayout، MaterialButton، TabLayout
    // ═══════════════════════════════════════════════════════════
    implementation 'com.google.android.material:material:1.11.0'

    // ═══════════════════════════════════════════════════════════
    // ConstraintLayout — برای layout های پیچیده‌تر
    // ═══════════════════════════════════════════════════════════
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ═══════════════════════════════════════════════════════════
    // ★ برای BiometricPrompt نیتیو (اثر انگشت/چهره)
    // ═══════════════════════════════════════════════════════════
    implementation 'androidx.biometric:biometric:1.1.0'
}
