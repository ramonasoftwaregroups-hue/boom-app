apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    buildToolsVersion "34.0.0"
    namespace "ir.picassooads.boom.twa"

    defaultConfig {
        applicationId "ir.picassooads.boom.twa"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 4
        versionName "4"
        resValue "string", "appName", "Boom Picasso"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "${projectDir}/android.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    // ═══════════════════════════════════════════════════════════
    // تغییر نام فایل خروجی APK
    // ═══════════════════════════════════════════════════════════
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def newApkName = "BoomPicasso-${variant.versionName}.apk"
            outputFileName = newApkName
        }
    }
}

// ═══════════════════════════════════════════════════════════════
// تغییر نام فایل خروجی AAB
// ═══════════════════════════════════════════════════════════════
tasks.matching { it.name == "bundleRelease" }.configureEach {
    doLast {
        def bundleDir = new File(project.buildDir, "outputs/bundle/release")
        def oldFile = new File(bundleDir, "app-release.aab")
        def newFile = new File(bundleDir, "BoomPicasso-${android.defaultConfig.versionName}.aab")
        if (oldFile.exists()) {
            oldFile.renameTo(newFile)
        }
    }
}

dependencies {
    // فایل‌های JAR محلی
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // ═══════════════════════════════════════════════════════════
    // AndroidX - برای Custom Tabs و AppCompatActivity
    // ═══════════════════════════════════════════════════════════
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.browser:browser:1.7.0'
}
